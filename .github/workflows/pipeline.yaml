name: Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  SAM_TEMPLATE: books-api/template.yaml
  STACK_NAME: books-api-dev
  AWS_REGION: ${{ vars.AWS_REGION }}
  PIPELINE_EXECUTION_ROLE: ${{ vars.PIPELINE_EXECUTION_ROLE }}
  CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}
  ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Validate AWS OIDC configuration
        run: |
          if [ -z "${{ vars.PIPELINE_EXECUTION_ROLE }}" ]; then
            echo "PIPELINE_EXECUTION_ROLE variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}" ]; then
            echo "CLOUDFORMATION_EXECUTION_ROLE variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.ARTIFACTS_BUCKET }}" ]; then
            echo "ARTIFACTS_BUCKET variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "AWS_REGION variable is not set"
            exit 1
          fi
          echo "AWS OIDC configuration validated successfully"

  test:
    needs:
      - validate-environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Run Unit Tests
        run: |
          dotnet test books-api/test/Bookstore.Test/Bookstore.Tests.csproj

  build-and-package:
    needs:
      - validate-environment
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: aws-actions/setup-sam@v2

      - name: Build resources
        run: sam build --template ${SAM_TEMPLATE}

      - name: Debug OIDC token
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== OIDC Token Claims ==="
          echo $TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS session
        run: |
          if ! aws sts get-caller-identity --region ${{ env.AWS_REGION }}; then
            echo "Failed to assume IAM role via OIDC"
            exit 1
          fi
          echo "Successfully assumed IAM role via OIDC"

      - name: Upload artifacts to artifact bucket
        run: |
          sam package \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --region ${AWS_REGION} \
            --output-template-file packaged-lambda.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: packaged-lambda.yaml
          path: packaged-lambda.yaml

  deploy:
    needs:
      - build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: aws-actions/setup-sam@v2
      - uses: actions/download-artifact@v4
        with:
          name: packaged-lambda.yaml

      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS session
        run: |
          if ! aws sts get-caller-identity --region ${{ env.AWS_REGION }}; then
            echo "Failed to assume IAM role via OIDC"
            exit 1
          fi
          echo "Successfully assumed IAM role via OIDC"

      - name: Deploy to AWS Account
        run: |
          sam deploy \
            --stack-name ${STACK_NAME} \
            --template-file packaged-lambda.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${AWS_REGION} \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --no-fail-on-empty-changeset \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE}

  integration-test:
    needs:
      - deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Integration Tests
        run: |
          dotnet test books-api/test/Bookstore.IntegrationTest/Bookstore.IntegrationTest.csproj
        env:
          STACK_NAME: ${{ env.STACK_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}

  output-endpoint:
    needs:
      - integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API Endpoint
        id: get-outputs
        run: |
          echo "AWS_API_ENDPOINT=$(aws cloudformation \
            describe-stacks \
            --region ${AWS_REGION} \
            --stack-name ${STACK_NAME} \
            --query 'Stacks[0].Outputs[0].OutputValue' \
            --output text)" >> $GITHUB_OUTPUT

      - name: Write Summary
        run: |
          echo "AWS_API_Gateway_Endpoint: ${{ steps.get-outputs.outputs.AWS_API_ENDPOINT }}" >> $GITHUB_STEP_SUMMARY
