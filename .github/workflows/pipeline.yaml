name: Pipeline

on: [workflow_dispatch]

permissions:
  id-token: write   # Requerido para OIDC (autenticacion sin credenciales estaticas)
  contents: read    # Permiso para clonar el repositorio

# GitHub Actions Runner Compatibility Notes:
# - All jobs use ubuntu-latest runner (Node.js 20+ by default)
# - All GitHub Actions are compatible with Node.js 20+
# - Using GitHub OIDC instead of long-term credentials
# - AWS SDK v3 is used through modern actions (configure-aws-credentials@v4)

env:
  # OIDC Configuration: No static credentials needed.
  # Authentication happens by assuming an IAM role via GitHub OIDC.

  # SAM Configuration
  SAM_TEMPLATE: books-api/template.yaml
  STACK_NAME: books-api-dev

  # IAM Role Configuration
  # PIPELINE_EXECUTION_ROLE: Role assumed by GitHub Actions via OIDC
  # CLOUDFORMATION_EXECUTION_ROLE: Role used by CloudFormation for resource creation
  PIPELINE_EXECUTION_ROLE: ${{ vars.PIPELINE_EXECUTION_ROLE }}
  CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}

  # S3 Configuration for SAM artifacts
  ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}

  # AWS Region Configuration
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Validate AWS OIDC configuration
        run: |
          echo "Validating AWS OIDC configuration..."
          echo "PIPELINE_EXECUTION_ROLE: ${{ vars.PIPELINE_EXECUTION_ROLE }}"
          echo "CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}"
          echo "ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}"
          echo "AWS_REGION: ${{ vars.AWS_REGION }}"

          if [ -z "${{ vars.PIPELINE_EXECUTION_ROLE }}" ]; then
            echo "PIPELINE_EXECUTION_ROLE variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}" ]; then
            echo "CLOUDFORMATION_EXECUTION_ROLE variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.ARTIFACTS_BUCKET }}" ]; then
            echo "ARTIFACTS_BUCKET variable is not set"
            exit 1
          fi
          echo "AWS OIDC configuration validated successfully (no static credentials needed)"

  test:
    needs: [validate-environment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - run: |
          dotnet test books-api/test/Bookstore.Test/Bookstore.Tests.csproj

  build-and-package:
    needs: [validate-environment, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: aws-actions/setup-sam@v3

      - name: Build resources
        run: sam build --template ${SAM_TEMPLATE}

      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS session
        run: |
          echo "Validating AWS session..."
          aws sts get-caller-identity --region ${{ env.AWS_REGION }}
          if [ $? -ne 0 ]; then
            echo "Failed to assume IAM role via OIDC: ${{ env.PIPELINE_EXECUTION_ROLE }}"
            echo "Please check:"
            echo "1. IAM role trust relationship with GitHub OIDC"
            echo "2. OIDC provider configuration in AWS IAM"
            echo "3. Role permissions"
            exit 1
          fi
          echo "Successfully assumed IAM role via OIDC"

      - name: Upload artifacts to artifact buckets
        run: |
          sam package \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --region ${AWS_REGION} \
            --output-template-file packaged-lambda.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-lambda.yaml
          path: packaged-lambda.yaml

  deploy:
    needs: [build-and-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: aws-actions/setup-sam@v3
      - uses: actions/download-artifact@v4
        with:
          name: packaged-lambda.yaml

      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: arn:aws:iam::962682390364:role/pipeline-execution-role
            aws-region: us-east-1
          # role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          # aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS session
        run: |
          echo "Validating AWS session..."
          aws sts get-caller-identity --region ${{ env.AWS_REGION }}
          if [ $? -ne 0 ]; then
            echo "Failed to assume IAM role via OIDC: ${{ env.PIPELINE_EXECUTION_ROLE }}"
            echo "Please check OIDC configuration and IAM role permissions"
            exit 1
          fi
          echo "Successfully assumed IAM role via OIDC"

      - name: Deploy to account
        run: |
          sam deploy --stack-name ${STACK_NAME} \
            --template packaged-lambda.yaml \
            --capabilities CAPABILITY_IAM \
            --region ${AWS_REGION} \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --no-fail-on-empty-changeset \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE}

  integration-test:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          dotnet test books-api/test/Bookstore.IntegrationTest/Bookstore.IntegrationTest.csproj
        env:
          STACK_NAME: ${{ env.STACK_NAME}}
          AWS_REGION: ${{ env.AWS_REGION }}

  output-endpoint:
    needs: [integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Assume the pipeline user role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          echo "AWS_API_ENDPOINT=$( aws cloudformation \
            --region ${AWS_REGION} describe-stacks \
            --stack-name ${STACK_NAME} \
            --query "Stacks[0].Outputs[0].OutputValue" --output text)" >> $GITHUB_OUTPUT
        id: get-outputs
      - name: Write summary
        run: |
          echo "AWS_API_Gateway_Endpoint: ${{steps.get-outputs.outputs.AWS_API_ENDPOINT}}" >> $GITHUB_STEP_SUMMARY
